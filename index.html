程中面临的主要困境；政策制定科学程序的基本思路；政策制定科学程序的基本框架和步骤\n\n预期效果：初步认识并了解政策制定科学程序的基本思路、基本框架和步骤\n\n\t\n\n \n\n\n\n\n2\n\n\t\n\n政策制定科学程序的总体讨论\n\n教学内容：分组讨论和交流政策制定科学程序\n\n预期效果：加深对政策制定科学程序的理解和认识\n\n\t\n\n选择某一特定问题或政策，以小组为单位讨论如何进行政策研究与实践\n\n\n\n\n3\n\n\t\n\n政策问题确认的基本原理与思路\n\n教学内容：讲解政策问题确认相关的基本概念；政策问题确认的目的、思路和基本步骤；政策问题确认过程与高价值政策制定程序的逻辑性；各步骤的目标、原则以及常用方法；政策问题确认与现有政策理论的联系和区别\n\n预期效果：掌握政策问题确认环节的基本概念、目的、思路和基本步骤\n\n\t\n\n \n\n\n\n\n4\n\n\t\n\n政策问题确认步骤讨论与分析\n\n教学内容：分组汇报和交流政策问题确认案例\n\n预期效果：加深学生对政策问题步骤的理解和实际运用能力\n\n\t\n\n聚焦选择的特定领域，完成问题确认的案例讨论，占总分5分\n\n\n\n\n5\n\n\t\n\n政策问题根源分析的基本原理与思路（一）\n\n教学内容：讲解政策问题根源分析相关基本概念、理论基础及意义；思路和基本步骤；具体步骤的目标、原则以及方法；制定者/研究者角色定位、共同目标；与前承环节、后续环节的关系\n\n预期效果：掌握政策问题根源分析环节的基本概念、目的、思路和基本步骤\n\n\t\n\n \n\n\n\n\n6\n\n\t\n\n政策问题根源分析的基本原理与思路（二）\n\n教学内容：讲解政策问题根源分析相关基本概念、理论基础及意义；思路和基本步骤；具体步骤的目标、原则以及方法；制定者/研究者角色定位、共同目标；与前承环节、后续环节的关系\n\n预期效果：掌握政策问题根源分析环节的基本概念、目的、思路和基本步骤\n\n\t\n\n \n\n\n\n\n7\n\n\t\n\n政策问题根源分析步骤讨论与分析\n\n教学内容：分组汇报和交流政策问题根源分析案例\n\n预期效果：加深学生对政策问题根源分析环节的理解和实际运用能力\n\n\t\n\n聚焦选择的特定问题，完成问题根源分析的案例讨论，占总分5分\n\n\n\n\n8\n\n\t\n\n政策方案研制的基本原理与思路\n\n教学内容：讲解政策方案研制的目的、任务及思路、步骤；相关的基本概念；政策方案研制的主要方法；政策方案研制与政策问题根源分析、政策方案可行性论证的关系\n\n预期效果：掌握政策方案研制环节的基本概念、目的、思路和基本步骤\n\n\t\n\n \n\n\n\n\n9\n\n\t\n\n政策方案研制步骤讨论与分析\n\n教学内容：分组汇报和交流政策方案研制案例\n\n预期效果：加深学生对政策方案研制环节的理解和实际运用能力\n\n\t\n\n聚焦选择的特定问题，完成方案研制的案例讨论，占总分5分\n\n\n\n\n10\n\n\t\n\n政策方案可行性论证的基本原理与思路\n\n教学内容：讲解政策方案可行性论证的基本目的和意义；论证的逻辑思路；具体步骤与方法；制定者与研究者主要概念和要点\n\n预期效果：掌握政策方案可行性论证环节的基本概念、目的、思路和基本步骤\n\n\t\n\n \n\n\n\n\n11\n\n\t\n\n政策方案可行性论证步骤讨论与分析\n\n教学内容：分组汇报和交流政策方案可行性论证案例\n\n预期效果：加深学生对政策方案可行性论证环节的理解和实际运用能力\n\n\t\n\n聚焦选择的特定问题，完成可行性分析的案例讨论，占总分5分\n\n\n\n\n12\n\n\t\n\n政策执行的基本原理与思路\n\n教学内容：讲解政策执行的基本概念；具体步骤与方法；与高价值政策以及前后继承环节的逻辑关系\n\n预期效果：掌握政策执行环节的基本概念、目的、思路和基本步骤\n\n\t\n\n \n\n\n\n\n13\n\n\t\n\n政策评价的基本原理与思路\n\n教学内容：讲解政策评价的目的、可考核目标、思路、步骤与方法；基本概念、作用与意义；与制定高价值政策、前后环节间的逻辑关系\n\n预期效果：掌握政策评价环节的基本概念、目的、思路和基本步骤\n\n\t\n\n \n\n\n\n\n14\n\n\t\n\n政策去向的基本原理与思路\n\n教学内容：讲解政策去向的目的意义、基本任务、思路步骤；政策延续、政策调整、政策终结和政策法律化的基本概念；各步骤的目标、操作程序、原则和方法；政策与法律之间的关系\n\n预期效果：掌握政策去向环节的基本概念、目的、思路和基本步骤\n\n 快速评估方法介绍、社区健康需求分析\t现场参观 + 社区医生带教 + 小组讨论\t社区服务中心\n6\t社区服务中心实践（二）：实地问卷调查实操\t在社区开展真实或模拟的问卷调查（如慢性病危险因素调查）\t实地实践 + 社区带教 + 小组执行\t社区服务中心\n7\t医院实践（一）：医院感染监测与暴发识别\t医院感染监测系统、院内感染暴发的识别与初步调查流程\t现场参观 + 感控科带教讲解\t医院感控科\n8\t医院实践（二）：病例对照调查现场实操\t在医院场景下开展简易病例对照调查（如院内感染危险因素访谈）\t实地实践 + 带教指导 + 小组讨论\t医院相关科室\n9\t现场数据快速分析技术\t现场条件下的数据录入、质控、快速统计分析（Epi Info、Excel等工具）\t课堂讲授 + 上机操作 + 案例练习\t计算机教室\n10\t风险沟通与现场报告撰写\t现场信息报告撰写、与社区/媒体/机构的沟通策略、应急沟通演练\t课堂讲授 + 情景模拟 + 角色扮演\t教室\n11\t综合实践演练：场景发布与方案执行\t发布综合场景（如不明原因疾病暴发），小组完成方案设计及模拟现场调查\t任务驱动 + 小组研讨 + 模拟演练\t校内模拟实训室/教室\n12\t综合实践演练：数据分析与报告撰写\t各小组完成数据分析、调查报告初稿撰写及组内复盘\t小组协作 + 导师巡场指导\t教室/自习\n13\t成果汇报答辩与课程总结（2学时）\t各小组汇报现场调查报告，接受师生质询；课程总结与复盘\t小组汇报 + 答辩互评 + 导师总评","assessment":"考核指标\nAssessment Criteria\t权重(%)\nPercentage(%)\t评定标准\nAssessment Standard\n出勤Attendance\t30\t缺勤一次扣3分\n作业/实验/实践Assignment\t30\t根据实践讨论的内容和表现给分\n汇报Presentation\t40\t数据分析、调查报告初稿撰写及组内复盘\n成绩记载方式 Grading System\t等级制"},{"category":"专业选修课","code":"PHPM50008","name":"人居环境健康与政策","hours":36,"credits":2,"teacher":"徐燕意","campus":"枫林校区","scheduleText":"9,12周 星期二[11-13节] F2209\n6-8,11周 星期二[11-13节] F2209\n1-3,5,10,13周 星期二[11-13节] F2209","availability":"已满","conflict":true,"selected":false,"url":"https://fdjwgl.fudan.edu.cn/manager/teaching-syllabus/open-info/1050768","description":"本课程面向具有一定基础的本科和研究生同学，尤其是具备了一定的环境流行病学、环境毒理学等相关基础课程的同学，并需要进一步了解和掌握，无论环境流行病学还是环境毒理学，最终如何转化为改善人居环境的有效政策和实践应用。\n\n   本课程全英文授课，按2/3的校内课堂学习和1/3的行业企业实践学习相结合，走出大学课堂，走向与环境健康紧密应用的气象、环境监测、疾病预防控制、卫生监督、社区卫生服务中心等行业部门，开展环境健康和实践学习的有机结合。引导学生梳理环境健康实践转化为政策的可能路径、真实场景的应用现况及不足，提出相关行业环境健康政策应用和亟待研发的前景和设计。","method":"教学方式：\n1. 课堂讲授与案例研讨结合：以校内课堂为基础，系统讲授环境健康学科知识与政策转化理论，结合气象、疾控等行业真实案例，组织学生分组研讨，引导学生结合基础学科知识分析案例中政策应用的亮点与不足，深化对理论知识的理解。\n2. 行业实践调研：按照课程1/3实践占比要求，组织学生走进环境监测、社区卫生服务中心等相关行业部门，开展实地调研，由行业导师现场讲解实践运作流程、政策落地细节，让学生直观感受学科知识的实践应用场景。\n34. 项目式学习：布置环境健康政策设计相关实践项目，引导学生结合课堂所学和行业调研成果，梳理政策转化路径，针对行业现存不足，提出政策应用优化方案或研发建议，培养学生的实践应用与创新能力。","outline":"教学内容及进度安排/Course Content & Schedule\n说明：本课程共12次课，每次3学时，总计36学时；其中校内课堂8次（第1-6次、第9-10次），校外实践4次（第7-8次、第11-12次），同步明确各次课教学目标、作业及考核相关要求。\n教学周/Teaching Week\n\t\n课次/Class Time\n\t\n教学形式/Teaching Form\n\t\n教学内容/Course Content\n\t\n教学目标/Teaching Objectives\n\t\n作业及考核要求/Assignment & Assessment Requirements\n\n\n第1周\n\t\n第1次（3学时）\n\t\n校内课堂\n\t\n课程导入：课程整体框架、学习要求及考核标准；环境健康学科概述，明确环境流行病学、环境毒理学与人居环境改善、政策转化的核心关联；梳理课程学习重点与实践安排。\n\t\n1. 了解课程整体规划、学习目标及考核方式；2. 掌握环境健康学科的核心内涵，明确两大基础学科的定位及课程学习意义；3. 建立学科知识与政策应用、实践落地的初步认知。\n\t\n \n\n\n第2周\n\t\n第2次（3学时）\n\t\n校内课堂\n\t\n核心知识讲授：环境流行病学核心原理、研究方法（队列研究、病例对照研究等）；结合典型案例，讲解环境流行病学在人居环境风险评估中的应用逻辑。\n\t\n1. 系统掌握环境流行病学的核心原理与关键研究方法；2. 能够结合案例分析环境流行病学在人居环境风险评估中的具体应用；3. 为后续政策转化学习奠定学科知识基础。\n\t\n作业：结合课堂案例，尝试设计1个简单的环境流行病学调研思路（100字左右）；考核：课堂随机提问。\n\n\n第3周\n\t\n第3次（3学时）\n\t\n校内课堂\n\t\n核心知识讲授：环境毒理学核心概念、毒性作用机制；环境污染物对人体健康的影响路径，结合案例分析污染物监测与健康风险防控的关联。\n\t\n1. 掌握环境毒理学的核心概念及毒性作用机制；2. 理解环境污染物与人体健康的关联，明确污染物监测的重要性；3. 衔接环境流行病学知识，构建完整的学科知识框架。\n\t\n \n\n\n第4周\n\t\n第4次（3学时）\n\t\n校内课堂（案例研讨）\n\t\n案例研讨：选取气象行业环境健康相关案例（如极端天气与人群健康风险防控），组织学生分组研讨；分析案例中环境健康知识的应用的亮点与不足，初步探讨案例对应的政策优化方向。\n\t\n1. 熟悉气象行业与环境健康的结合场景；2. 提升结合学科知识分析真实案例、发现问题的能力；3. 初步建立案例分析与政策转化的关联思维。\n\t\n作业：每组提交1份案例研讨报告，明确研讨结论及政策优化初步建议；考核：小组研讨参与度+报告质量。\n\n\n第5周\n\t\n第5次（3学时）\n\t\n校内课堂（案例研讨）\n\t\n案例研讨：选取疾控、环境监测行业案例（如环境污染物监测与疾病防控联动），分组研讨；梳理案例中环境健康实践转化为政策的现有路径，分析路径中的堵点与不足。\n\t\n1. 熟悉疾控、环境监测行业的环境健康实践场景；2. 掌握环境健康实践转化为政策的基本路径，能够分析路径中的问题；3. 提升综合分析与团队协作能力。\n\t\n \n\n\n第6周\n\t\n第6次（3学时）\n\t\n校内课堂（项目布置）\n\t\n政策转化理论讲授：环境健康实践转化为政策的核心逻辑、关键环节及常见问题；布置课程实践项目（环境健康政策设计），明确项目要求、分组规则及提交时间；讲解项目调研与设计的核心要点。\n\t\n1. 掌握环境健康实践转化为政策的核心逻辑与关键环节；2. 明确课程实践项目的要求、流程及核心任务；3. 具备初步的政策设计与项目规划能力。\n\t\n作业：各组完成项目分工，提交项目初步规划方案；考核：方案完整性与可行性。\n\n\n第7周\n\t\n第7次（3学时）\n\t\n校外实践（环境监测部门）\n\t\n走进环境监测部门，由行业导师讲解环境污染物监测流程、监测技术及数据应用；实地观察监测设备运作，了解监测数据与环境健康政策制定的关联；收集实践调研资料。\n\t\n1. 熟悉环境监测部门的实践运作模式及核心工作内容；2. 理解环境监测数据在环境健康政策制定中的作用；3. 积累实践调研经验，为课程项目提供数据与案例支撑。\n\t\n作业：撰写实践调研报告，记录实践收获、观察到的问题及对项目的启发；考核：实践参与度+报告质量（计入平时成绩，占比8%）。\n\n\n第8周\n\t\n第8次（3学时）\n\t\n校外实践（疾控部门）\n\t\n走进疾病预防控制部门，了解疾控部门在环境健康风险防控中的职责、工作流程；由行业导师讲解环境相关疾病的监测、防控政策及实践案例；与工作人员交流，探讨政策落地中的难点。\n\t\n1. 熟悉疾控部门在环境健康领域的核心职能与实践模式；2. 掌握环境相关疾病防控政策的落地流程及常见难点；3. 深化对环境健康政策实践应用的认知，完善项目思路。\n\t\n作业：补充完善实践调研报告，结合疾控部门实践，补充政策落地难点分析；考核：实践参与度+报告完善情况。\n\n\n第9周\n\t\n第9次（3学时）\n\t\n校内课堂（项目指导）\n\t\n各组汇报项目进展，分享实践调研成果；教师针对各组遇到的问题（如政策设计思路、数据应用等）进行针对性指导；讲解政策设计方案的撰写要点，引导学生优化项目方案。\n\t\n1. 梳理项目进展，明确自身存在的问题；2. 掌握环境健康政策设计方案的撰写要点；3. 结合教师指导与实践成果，优化项目方案，提升项目设计能力。\n\t\n \n\n\n第10周\n\t\n第10次（3学时）\n\t\n校内课堂（案例拓展+项目交流）\n\t\n案例拓展：分享社区卫生服务中心环境健康服务案例，分析基层环境健康政策的应用现状；组织各组开展项目交流，相互借鉴经验，进一步优化项目方案；明确项目最终提交要求。\n\t\n1. 了解基层社区环境健康服务的实践场景及政策应用现状；2. 通过项目交流，拓宽政策设计思路，完善项目方案；3. 明确项目最终提交标准，做好项目收尾准备。\n\t\n作业：各组完成项目最终方案撰写，准备项目汇报；考核：项目方案完整性。\n\n\n第11周\n\t\n第11次（3学时）\n\t\n校外实践（社区卫生服务中心+气象部门）\n\t\n走进社区卫生服务中心，了解基层环境健康服务的开展情况、政策落地效果及居民需求；走进气象部门，学习气象数据在环境健康风险预警、政策制定中的应用；补充项目调研资料，验证项目方案的可行性。\n\t\n1. 熟悉基层社区及气象部门的环境健康实践场景，掌握相关政策落地现状；2. 验证项目方案的可行性，补充完善方案细节；3. 提升将实践经验转化为政策设计的能力。\n\t\n作业：结合本次实践，最终完善项目方案及调研报告，准备汇报PPT；考核：实践参与度。\n\n\n第12周\n\t\n第12次（3学时）\n\t\n校内课堂（项目汇报+课程总结）\n\t\n各组进行项目汇报（每组5-8分钟），展示政策设计方案、调研成果及建议；教师及其他小组进行点评，提出优化意见；课程总结，梳理核心知识点、实践重点及政策转化逻辑，回顾课程学习成果。\n\t\n1. 提升项目汇报与表达能力，能够清晰展示项目成果；2. 吸收点评意见，深化对环境健康政策设计的理解；3. 系统梳理课程知识，形成完整的知识与实践体系。\n\t\n作业：提交项目最终方案、完整调研报告及汇报PPT；考核：项目汇报质量+最终成果）；课程总考核：综合评定课程成绩。","assessment":"考核指标\nAssessment Criteria\t权重(%)\nPercentage(%)\t评定标准\nAssessment Standard\n出勤Attendance\t10\t\n汇报Presentation\t30\t\n作业/实验/实践Assignment\t30\t\n分组讨论Group Discussion\t30\t\n成绩记载方式 Grading System\t等级制"},{"category":"专业选修课","code":"PHPM60010","name":"毒理学原理","hours":36,"credits":2,"teacher":"孙品","campus":"枫林校区","scheduleText":"1-3,5,7,9-10周 星期五[6-9节] F2406\n6-8双周 星期五[6-9节] F2406","availability":"已满","conflict":false,"selected":false,"url":"https://fdjwgl.fudan.edu.cn/manager/teaching-syllabus/open-info/1050667","description":"本课程面向预防医学硕士研究生，在《基础毒理学》基础上，系统讲授现代毒理学核心原理与研究范式。课程围绕“暴露—剂量—机制—毒性—风险”主线，重点涵盖毒物动力学、剂量—反应、作用机制、特殊人群毒理学、系统毒理学、AOP、NAMs、AI及风险评估等内容。通过顶刊文献汇报与案例讨论，培养学生批判性阅读、科学问题凝练、机制推理及毒理学研究设计能力。","method":"采用“理论讲授—案例教学—顶刊文献研讨—课堂汇报—互动讨论—研究设计”相结合的教学模式","outline":"周次\t日期\t星期\t节次\t上课内容\t教师\n1\t9.11\t五\t6-9\t绪论：什么是现代毒理学？\t常秀丽\n2\t9.18\t五\t6-9\t毒物动力学：从“暴露剂量”到“靶组织剂量”\t常秀丽\n5\t10.9\t 第8-9周：儿童青少年心理卫生问题（8学时）\n\n介绍儿童心理病理形成的基本理论和发展模型，正常发展过程呈现的问题和问题行为，从婴儿期到成年早期不同阶段典型的心理病理问题，包括婴儿期的精神发育迟滞，童年期的孤独整谱系障碍，婴儿期至学龄前期的不安全依恋，学龄前期的注意力缺陷多动障碍和学习障碍，童年中期的焦虑障碍，童年中期至青春期的心境障碍和自杀，青少年过渡期的进食障碍，青少年晚期至成年早期的边缘型人格障碍。\n\n第10-11周：心理健康促进（8学时）\n\n介绍儿童心理健康促进的干预地图模式，干预规划设计，案例分析和讨论\n\n第12-13周：文献阅读：心理健康促进（8学时）\n\n阅读关于儿童和青少年心理健康促进的相关文献，自主学习。\n\n第14周：课程论文（2学时）\n\n自主选题：建议结合自己专业背景自选与儿童心理健康相关的主题；\n\n完成一篇5000-10000字的综述，参考文献不少于10篇近期和代表性研究文献。","assessment":"考核指标\nAssessment Criteria\t权重(%)\nPercentage(%)\t评定标准\nAssessment Standard\n出勤Attendance\t15\t课堂签到\n课堂表现Participation\t15\t积极参与课堂讨论和交流\n课题论文Research Paper\t70\t按要求完成课程论文\n成绩记载方式 Grading System\t等级制"},{"category":"专业选修课","code":"PHPM60024","name":"分子流行病学","hours":36,"credits":2,"teacher":"胡屹","campus":"枫林校区","scheduleText":"7-9,13周 星期五[6-9节] F2504\n11-12周 星期五[6-9节] F2504\n5-6,10,14-15周 星期五[6-9节] F2504","availability":"已满","conflict":false,"selected":false,"url":"https://fdjwgl.fudan.edu.cn/manager/teaching-syllabus/open-info/1050948","description":"分子流行病学（molecular epidemiology）是应用先进的技术测量生物学标志的分布情况，结合流行病学现场研究方法，从分子或基因水平阐明疾病的病因及其相关的致病过程，并研究疾病的防治和促进健康的策略和措施的科学。本课程涵盖分子流行病学的基本概念、理论和研究方法，详细介绍分子流行病学常用的生物标志，各种标志的测量方法及分子流行病学在传染病和非传染病防制、健康 促进中的应用前景。","method":"理论授课:教师讲解分子流行病学的基本概念、研究方法、实验技术\n\n案例分析/讨论:学生分组讨论已发表的分子流行病学研究论文\n\n数据分析训练:学习如何处理分子数据\n\n课程作业与报告:书面报告或口头汇报，锻炼文献检索、批判性思维与学术表达能力","outline":"分子流行病学概述，理论\n\n实验：人群全基因组测序技术的原理及其数据处理，实验\n\n分子流行病学研究设计，理论\n\n微生物病原体分子流行病学研究，理论\n\n分子流行病学研究设计课堂交流和讨论，讨论\n\n实验：传染病分子流行病学数据分析，实验\n\n慢性病分子流行病学研究，理论\n\n实验：慢性病分子流行病学数据分析，实验\n\n实验：序列分析，实验\n\n实验：分子流行病学数据分析策略和可视化，实验\n\n讨论与考试","assessment":"考核指标\nAssessment Criteria\t权重(%)\nPercentage(%)\t评定标准\nAssessment Standard\n出勤Attendance\t5\t\n汇报Presentation\t20\t\n课堂表现Participation\t5\t\n期末考试Final Examination：论文\t70\t\n成绩记载方式 Grading System\t等级制"},{"category":"专业选修课","code":"PHPM60026","name":"公共卫生与环境相关疾病","hours":36,"credits":2,"teacher":"陈仁杰","campus":"枫林校区","scheduleText":"8,12-13周 星期一[11-12节] F2108\n1-3,6-7,10-11,15-16周 星期一[11-12节] F2108\n4,9,14周 星期一[11-12节] F2108","availab \n\n\t\n\n教学目标\n\n\n\n\n1\n\n\t\n\n统计软件概览\n\nSPSS简介\n\n数据录入\n\n\t\n\n掌握数据编辑窗口和结果输出窗口的界面内容，能够在SPSS中进行简单的数据库建立、数据录入等基本操作;\n\n熟悉SPSS基础课程的整体讲解内容，结合个人需求确定选课与否；\n\n了解SPSS在统计软件的地位，熟悉File、Edit等菜单的功能。\n\n\n\n\n2\n\n\t\n\nSPSS数据管理入门\n\n\t\n\n­掌握计算新变量、变量编秩等变量管理操作，掌握记录加权等记录管理操作。\n\n熟悉多个文件间的管理操作，如:数据库合并、拼接、数据字典等。\n\n\n\n\n3\n\n\t\n\n统计图制作\n\n\t\n\n­掌握统计图的分类，能够根据资料类型和分析目的正确地选择并制作统计图；\n\n掌握常用统计图的绘制，熟悉各类图的特色编辑方法。\n\n\n\n\n4\n\n\t\n\n统计描述\n\n统计表制作\n\n\t\n\n­掌握统计描述指标体系，能正确运用SPSS求出均数、标准差等常用指标。\n\n掌握SPSS表格的制作方法\n\n熟悉SPSS表格结构和功能特点及编辑方法。\n\n\n\n\n5\n\n\t\n\n统计推断入门\n\n均数间的比较\n\n基于秩次的非参数检验\n\n\t\n\n掌握假设检验的基本原理、主要步骤及注意问题，能够用SPSS独立地进行不同设计下的均数比较以及相应的基于秩次的非参数分析，对输出的结果能够正确阅读；掌握参数方法的应用条件，能正确判断是否应使用非参数检验。\n\n熟悉非参数方法的原理，熟悉方差分析中的多重比较方法，对简单的研究会选择相应的方法。\n\n\n\n\n6\n\n\t\n\n卡方检验\n\n相关与回归\n\n\t\n\n掌握各种卡方检验、简单线性以及简单回归分析，会正确阅读输出的结果；\n\n掌握无序分类变量中率的差异性检验与变量间的关联性分析的原理差异，能根据不同的研究选择相应的检验统计量及P值；\n\n掌握相关与回归方法间的联系与区别\n\n\n\n\n7\n\n\t\n\n方差分析模型入门\n\n\t\n\n熟悉线性模型（方差与回归模型）的基本结构。\n\n能正确阅读各种方差分析模型的分析结果。\n\n了解模型的诊断。\n\n\n\n\n8\n\n\t\n\n线性回归模型入门\n\n\n\n\n9\n\n\t\n\nLogistic回归模型簇入门\n\n\t\n\n熟悉Logistic回归模型的基本原理和模型结构，能正确阅读其分析结果。\n\n\n\n\n10\n\n\t\n\n生存分析入门\n\n\t\n\n熟悉不同生存分析方法的特点、适用性和优势，能正确阅读分析结果。","assessment":"考核指标\nAssessment Criteria\t权重(%)\nPercentage(%)\t评定标准\nAssessment Standard\n出勤Attendance\t10\t按时听课\n课堂表现Participation\t20\t认真听讲、积极发言\n课题论文Research Paper\t70\t按要求完成统计分析报告\n成绩记载方式 Grading System\t两级制"},{"category":"专业选修课","code":"PHPM60033","name":"SAS统计分析","hours":36,"credits":2,"teacher":"邓伟","campus":"枫林校区","scheduleText":"1-3,5-9周 星期四[8-9节] F2108\n1-3,5-9周 星期四[6-7节] F2104\n10周 星期四[6-9节] F2104","availability":"已满","conflict":true,"selected":false,"url":"https://fdjwgl.fudan.edu.cn/manager/teaching-syllabus/open-info/1048247","description":"SAS系统是用于数据分析与决策支持的大型集成式模块化软件包，是进行数据分析的有力工具，为国际标准统计软件之一。本课程将介绍SAS软件及其的编程方法，SAS中的基本数据整理，常用统计分析方法的SAS实现，包括各种单因素分析方法，相关回归分析，生存分析，多元线性回归，多元logistics回归和COX回归等。","method":"课堂教学、实践操作（上机操作）","outline":"周次\t日期\t星期\t节次\t上课内容\n1\t2026/9/10\t四\t6-9\t概论、SAS数据集1\n2\t2026/9/17\t四\t6-9\tSAS数据集2\ function weeks(s){s=s.replace(/[（）]/g,m=>m==='（'?'(':')').replace(/~/g,'-').replace(/\s/g,'');let o=[];for(let p of s.split(',')){let odd=/单/.test(p),even=/双/.test(p);p=p.replace(/[单双()]/g,'');let m=p.match(/^(\d+)(?:-(\d+))?$/);if(!m)continue;for(let w=+m[1];w<=+(m[2]||m[1]);w++)if((!odd||w%2)&&(!even||!(w%2)))o.push(w)}return[...new Set(o)]}
function meetings(c){let o=[];for(const line0 of String(c.scheduleText||'').split(/\n+/)){let line=line0.trim(),m=line.match(/^(.+?)周\s*星期([一二三四五六日])\s*\[?(\d+)\s*[-~]\s*(\d+)节?\]?\s*(.*)$/);if(!m)continue;let a=+m[3],b=+m[4],clock=bells[a]&&bells[b]?` · ${bells[a][0]}–${bells[b][1]}`:'';for(const w of weeks(m[1])){let d=new Date(2026,8,7+(w-1)*7+off[m[2]]);o.push({week:w,date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,period:`星期${m[2]} ${a}–${b}节${clock}`,place:m[5].trim()||c.campus})}}return o}
function topic(c,w){let raw=String(c.outline||'').replace(/\r/g,''),z=Object.keys(cn).find(k=>cn[k]===w),ps=[new RegExp(`第\\s*${w}\\s*周[：:]?\\s*([^\\n]{2,220})`),z&&new RegExp(`第${z}周(?:至第?[一二三四五六七八九十]+周)?[：:]?\\s*([^\\n]{2,220})`)].filter(Boolean);for(const p of ps){let m=raw.match(p);if(m)return{t:short(m[1].split(/[；。]/)[0],55),d:short(m[1],150)}}let l=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean),i=l.findIndex(x=>new RegExp(`^${w}(?:\\s|$|[.、])`).test(x));if(i>=0){let a=[];for(let j=i+1;j<Math.min(i+10,l.length);j++){let x=l[j];if(/^\d{1,2}$/.test(x)||/^\d{1,2}[\/月.-]\d{1,2}/.test(x)||/^(星期)?[一二三四五六日]$/.test(x)||/^\d+[-~]\d+节?$/.test(x)||/(教授|副教授|讲师)$/.test(x))continue;a.push(x);if(a.join(' ').length>145)break}if(a.length)return{t:short(a[0].split(/[；。]/)[0],55),d:short(a.join(' '),150)}}return{t:'课程主题',d:short(c.description||raw||c.name,150)}}
function events(){let o=[];for(const c of data.filter(x=>selected.has(x.code)))for(const m of meetings(c))o.push({...m,...topic(c,m.week),c});return o}
function picker(){let q=search.value.trim().toLowerCase(),cat=category.value,n=0;document.querySelector('#picker').innerHTML=data.map(c=>{let show=(!q||(c.name+' '+c.code).toLowerCase().includes(q))&&(!cat||c.category===cat);if(show)n++;return`<label class="pick ${show?'':'hidden'}"><input type="checkbox" data-code="${esc(c.code)}" ${selected.has(c.code)?'checked':''}><span><span class="pick-name">${esc(c.name)}</span>${c.selected?'<i class="tag own">我的已选</i>':''}${c.conflict?'<i class="tag conflict">冲突</i>':''}<div class="pick-meta">${esc(c.code)} · ${esc(c.category)} · ${c.credits}学分 · ${esc(c.teacher)}</div></span></label>`}).join('');filterCount.textContent=`当前筛选 ${n} 门／共 ${data.length} 门`;document.querySelectorAll('#picker input').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.code):selected.delete(x.dataset.code);render(false)})}
function cal(){let[y,m]=months[mi],first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),es=events();monthTitle.textContent=`${y}年${m+1}月`;let h=['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">周${x}</div>`).join('');for(let i=0;i<(first.getDay()+6)%7;i++)h+='<div class="day blank"></div>';for(let d=1;d<=days;d++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,de=es.filter(e=>e.date===k);h+=`<div class="day"><div class="date">${d}</div>${de.map(e=>`<article class="event ${e.c.conflict?'conflict':''}"><div class="course">${esc(e.c.name)} <small>W${e.week}</small></div><div class="where">${esc(e.period)} · ${esc(e.place)}</div><div class="topic">${esc(e.t)}</div><div class="content">${esc(e.d)}</div></article>`).join('')}</div>`}calendar.innerHTML=h;prev.disabled=mi===0;next.disabled=mi===months.length-1}
function cards(){courseCards.innerHTML=data.filter(c=>selected.has(c.code)).map(c=>`<article class="course-card"><h3>${esc(c.name)} <i class="tag">${esc(c.code)}</i></h3><div class="small">${esc(c.category)} · ${c.credits}学分/${c.hours}学时 · ${esc(c.teacher)}</div><p><b>排课：</b>${esc(c.scheduleText)}</p><p><b>考核：</b>${esc(short(c.assessment,380))}</p><p><b>简介：</b>${esc(short(c.description,280))}</p><a href="${esc(c.url)}" target="_blank">打开原始教学大纲 ↗</a></article>`).join('')||'<p>尚未选择课程。</p>'}
function render(p=true){if(p)picker();cal();cards();let a=data.filter(c=>selected.has(c.code));selectedCount.textContent=`已选择 ${a.length} 门`;creditCount.textContent=`合计 ${a.reduce((s,c)=>s+(+c.credits||0),0)} 学分`}
search.oninput=picker;category.onchange=picker;restore.onclick=()=>{selected.clear();defaults.forEach(x=>selected.add(x));render()};clear.onclick=()=>{selected.clear();render()};visibleAll.onclick=()=>{document.querySelectorAll('#picker input').forEach(x=>{if(!x.closest('.pick').classList.contains('hidden'))selected.add(x.dataset.code)});render()};prev.onclick=()=>{mi--;cal()};next.onclick=()=>{mi++;cal()};today.onclick=()=>{mi=0;cal()};render();
</script></body></html>
